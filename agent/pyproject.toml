[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-agent-starter"
version = "0.1.0"
description = "Offline artifact planner and optional OpenAI Agents SDK starter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["openai-agents==0.24.0"]

[project.scripts]
site-agent = "site_agent.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
